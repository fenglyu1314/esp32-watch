; PlatformIO 项目配置文件
; Waveshare ESP32-S3-Touch-LCD-1.28 圆形触摸屏手表项目


[env:esp32s3-touch-lcd-128]
; 固定使用 6.6.0 版，对应 Arduino-ESP32 v2.0.14
; Waveshare 官方文档要求 Arduino-ESP32 v2.0.12，6.6.0 是最接近的稳定版本
; 注意：不要升级到 6.7+（对应 Arduino-ESP32 v3.x，有破坏性 API 变更）
platform = espressif32@6.6.0
; ESP32-S3-DevKitC-1 是最接近本开发板的通用配置
board = esp32-s3-devkitc-1
framework = arduino

; 串口监视器波特率
monitor_speed = 115200

; 上传速度
upload_speed = 921600


; 依赖库
lib_deps =
    ; LovyanGFX：直接使用 ESP-IDF SPI 驱动，彻底绕开 Arduino SPI 冲突
    ; 对 ESP32-S3 + GC9A01A 圆形屏有专项支持
    lovyan03/LovyanGFX@^1.1.16

; 编译选项
build_flags =
    ; ESP32-S3 有两路串口：UART0（CH343P->COM口）和内置 USB CDC
    ; =0 表示 Serial 输出到 UART0，也就是 COM 口，用串口监视器能看到输出
    ; =1 则输出到内置 USB，监视 COM 口看不到任何内容
    -D ARDUINO_USB_CDC_ON_BOOT=0
